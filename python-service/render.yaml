services:
  - type: web
    name: spec-analyzer-api
    env: docker
    region: oregon
    # Instance type, not the workspace plan. Starter (0.5 CPU / 512 MB) could not
    # hold a large spec PDF in memory: /parse buffers the whole file, PyMuPDF
    # copies it again, and every page's text stays live until insert_pages_batch.
    plan: standard
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
